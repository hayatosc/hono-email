name: hono-compat

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  hono-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hono: ['4.5.0', '4.12.32', 'latest']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      - name: Prepare isolated consumer
        run: node runtime-tests/hono/prepare.mjs '${{ matrix.hono }}' "$RUNNER_TEMP/hono-consumer"
      - name: Install consumer dependencies
        working-directory: ${{ runner.temp }}/hono-consumer
        run: bun install
      - name: Verify published entry points
        working-directory: ${{ runner.temp }}/hono-consumer
        run: node --test compat.test.mjs
